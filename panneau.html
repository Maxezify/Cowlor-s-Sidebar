<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Les deux schémas, dès la première image (cf. panneau.css). -->
  <meta name="color-scheme" content="light dark">
  <title>Cowlor's Sidebar</title>
  <link rel="stylesheet" href="panneau.css">
  <!-- Le mode d'emploi a sa feuille, après celle du panneau (cf. guide.css). -->
  <link rel="stylesheet" href="guide.css">
</head>
<body>
  <!-- Le panneau est peuplé par panneau.js : rien n'est écrit en dur ici, ni
       libellé ni colonne. Le HTML ne pose que la charpente, parce qu'une page
       d'extension ne peut pas substituer __MSG_…__ dans son corps — seul le
       manifeste et le CSS le peuvent. Tout ce qui se lit vient donc de
       chrome.i18n, en douze locales, posé par data-i18n. -->
  <header class="tete">
    <img class="tete-logo" src="icons/icon48.png" alt="" width="26" height="26">
    <div class="tete-texte">
      <!-- Le nom du produit vient de la clé que le manifeste utilise déjà :
           une seconde clé aurait pu diverger de la première. -->
      <h1 class="tete-titre" data-i18n="extShortName"></h1>
      <p class="tete-sous" data-i18n="panelSubtitle"></p>
    </div>
    <div class="tete-etat" id="etat" hidden>
      <span class="pastille" id="etat-pastille"></span>
      <span id="etat-texte"></span>
    </div>
  </header>

  <div class="corps">
    <nav class="rail" id="rail" aria-label="Sections"></nav>

    <main class="vue" id="vue">
      <div class="vue-tete">
        <div>
          <h2 class="vue-titre" id="vue-titre"></h2>
          <p class="vue-desc" id="vue-desc"></p>
        </div>
        <div class="vue-actions" id="vue-actions"></div>
      </div>

      <!-- LE GUIDE, ET POURQUOI IL A SON PROPRE CONTENEUR. C'est la seule vue
           du panneau qui ne montre AUCUNE donnée : elle n'a ni cartouches, ni
           dessin, ni tableau, et surtout elle ne demande rien à la page. Lui
           faire emprunter le bloc `#message` — le seul autre à ne porter que
           du texte — l'aurait centré, borné à 42 caractères et privé de
           défilement, c'est-à-dire rendu illisible au troisième chapitre.
           Vide, il ne coûte rien : `hidden` le retire, et la règle est redite
           dans la feuille puisqu'on lui déclare un display. -->
      <div class="guide" id="guide" hidden></div>

      <div class="resume" id="resume"></div>

      <!-- LES RÉGLAGES ONT LEUR PROPRE CONTENEUR, pour la même raison que le
           guide : ce n'est ni un tableau, ni un dessin, ni un message. Les y
           faire entrer aurait voulu dire fabriquer des lignes de tableau qui
           contiennent des cases à cocher — c'est-à-dire un tableau qui n'en
           est plus un, avec des colonnes qui ne veulent rien dire.

           IL VIENT APRÈS LES CARTOUCHES, comme le tableau et le dessin : les
           chiffres se lisent sous le titre, pas au bas d'une liste qu'il faut
           d'abord dérouler. Posé avant, il les repoussait hors de la fenêtre.
           Vide, il ne coûte rien : `hidden` le retire, et la règle est redite
           dans la feuille puisqu'on lui déclare un display. -->
      <div class="reglages" id="reglages" hidden></div>

      <!-- L'AGENDA (4.25.0) a son conteneur, pour la même raison que le guide
           et les réglages : une semaine jour par jour et une liste de chaînes
           ne sont ni un tableau ni un dessin. Il vient après les cartouches,
           qui en résument les chiffres. -->
      <div class="agenda" id="agenda" hidden></div>

      <!-- LA PLACE DU DESSIN, entre les cartouches et le tableau. Toutes les
           sections n'ont pas de dessin, et celles qui en ont un n'ont pas
           forcément de tableau : les deux blocs se montrent et se cachent
           indépendamment. Vide, celui-ci ne prend aucune place — cf. la règle
           `hidden` répétée dans la feuille, la propriété display d'auteur
           l'emportant sinon sur celle du navigateur. -->
      <div class="visuel" id="visuel" hidden></div>

      <!-- Un tableau de DONNÉES (4.33.0.14) : sa légende — le titre de la
           vue — le nomme, ses en-têtes disent leur colonne, et son cadre, qui
           défile, est une région nommée qu'on atteint au clavier (Modern Web
           Guidance, « accessibility », « responsive-table »). -->
      <div class="tableau-cadre" id="tableau-cadre" role="region" aria-labelledby="vue-titre" tabindex="0">
        <table class="tableau" id="tableau">
          <caption class="lecteur-seul" id="tableau-legende"></caption>
          <thead id="tableau-tete"></thead>
          <tbody id="tableau-corps"></tbody>
        </table>
      </div>

      <div class="message" id="message" hidden>
        <p class="message-texte" id="message-texte"></p>
        <button class="bouton" id="message-bouton" hidden></button>
      </div>
    </main>
  </div>

  <footer class="pied">
    <button class="bouton bouton--fantome" id="btn-rapport" data-i18n="btnReport"></button>
    <button class="bouton bouton--fantome" id="btn-rescan" data-i18n="btnRescan"></button>
    <button class="bouton bouton--danger" id="btn-reset" data-i18n="btnReset"></button>
  </footer>

  <!-- LE RAPPORT, EN PLEIN PANNEAU. Un <dialog> ouvert par showModal()
       (4.33.0.14) : il tient le focus, rend le reste inerte, et Échap le ferme
       — c'est le navigateur qui le fait (Modern Web Guidance, « dialog »).
       Il se déclarait modal sans l'être : la tabulation en sortait.  Une vue qui recouvre tout plutôt qu'un
       fichier téléchargé : ce qu'on fait d'un rapport, c'est le coller dans une
       conversation, pas l'attacher. Et une zone de texte qu'on peut lire avant
       de copier est la seule façon de VÉRIFIER ce qu'on envoie — le fichier ne
       faisait que le promettre. -->
  <dialog class="rapport" id="rapport" aria-labelledby="rapport-titre">
    <header class="rapport-tete">
      <div class="rapport-texte-tete">
        <h2 class="rapport-titre" id="rapport-titre" data-i18n="reportTitle"></h2>
        <p class="rapport-desc" data-i18n="reportDesc"></p>
      </div>
      <!-- Une COMMANDE, et plus un écouteur (4.33.0.14) : « close » sur le
           rapport, que le navigateur exécute — Chrome 135, Firefox 144. La
           fermeture remet le focus au bouton qui l'a ouvert, et l'écouteur
           « close » du rapport efface sa note. -->
      <button class="bouton bouton--fantome" id="rapport-fermer" command="close" commandfor="rapport" data-i18n="btnClose"></button>
    </header>
    <!-- readonly, pas disabled : un champ désactivé n'est ni sélectionnable ni
         copiable, et c'est tout ce qu'on lui demande. -->
    <textarea class="rapport-zone" id="rapport-zone" readonly spellcheck="false"
              aria-describedby="rapport-titre"></textarea>
    <footer class="rapport-pied">
      <button class="bouton" id="rapport-copier" data-i18n="btnCopy"></button>
      <button class="bouton bouton--fantome" id="rapport-actualiser" data-i18n="btnRefresh"></button>
      <!-- Ce que « Copier » a fait, dit aussi aux lecteurs d'écran : une
           région vivante, toujours là, vide tant qu'il n'y a rien à dire
           (Modern Web Guidance, « copy-button »). -->
      <span class="pied-note" id="rapport-note" role="status"></span>
    </footer>
  </dialog>

  <!-- Confirmation des actions irréversibles. Une boîte dans le panneau et non
       un confirm() natif : confirm() est bloquant, non traduisible, et son
       apparence n'appartient à personne. -->
  <dialog class="voile" id="voile" role="alertdialog" aria-labelledby="boite-titre" aria-describedby="boite-texte">
    <div class="boite">
      <h3 id="boite-titre" class="boite-titre"></h3>
      <p class="boite-texte" id="boite-texte"></p>
      <div class="boite-pied">
        <!-- Annuler n'est qu'une fermeture : une commande, comme « Fermer » du
             rapport. L'écouteur « close » oublie l'action en attente. -->
        <button class="bouton" id="boite-annuler" command="close" commandfor="voile" data-i18n="btnCancel"></button>
        <button class="bouton bouton--danger" id="boite-ok" data-i18n="btnConfirm"></button>
      </div>
    </div>
  </dialog>

  <script src="panneau.js"></script>
</body>
</html>
