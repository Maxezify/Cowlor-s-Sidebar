<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cowlor's Sidebar</title>
  <link rel="stylesheet" href="panneau.css">
</head>
<body>
  <!-- Le panneau est peuplé par panneau.js : rien n'est écrit en dur ici, ni
       libellé ni colonne. Le HTML ne pose que la charpente, parce qu'une page
       d'extension ne peut pas substituer __MSG_…__ dans son corps — seul le
       manifeste et le CSS le peuvent. Tout ce qui se lit vient donc de
       chrome.i18n, en douze locales, posé par data-i18n. -->
  <header class="tete">
    <img class="tete-logo" src="icons/icon48.png" alt="" width="26" height="26">
    <div class="tete-texte">
      <!-- Le nom du produit vient de la clé que le manifeste utilise déjà :
           une seconde clé aurait pu diverger de la première. -->
      <h1 class="tete-titre" data-i18n="extShortName"></h1>
      <p class="tete-sous" data-i18n="panelSubtitle"></p>
    </div>
    <div class="tete-etat" id="etat" hidden>
      <span class="pastille" id="etat-pastille"></span>
      <span id="etat-texte"></span>
    </div>
  </header>

  <div class="corps">
    <nav class="rail" id="rail" aria-label="Sections"></nav>

    <main class="vue" id="vue">
      <div class="vue-tete">
        <div>
          <h2 class="vue-titre" id="vue-titre"></h2>
          <p class="vue-desc" id="vue-desc"></p>
        </div>
        <div class="vue-actions" id="vue-actions"></div>
      </div>

      <div class="resume" id="resume"></div>

      <!-- LA PLACE DU DESSIN, entre les cartouches et le tableau. Toutes les
           sections n'ont pas de dessin, et celles qui en ont un n'ont pas
           forcément de tableau : les deux blocs se montrent et se cachent
           indépendamment. Vide, celui-ci ne prend aucune place — cf. la règle
           `hidden` répétée dans la feuille, la propriété display d'auteur
           l'emportant sinon sur celle du navigateur. -->
      <div class="visuel" id="visuel" hidden></div>

      <div class="tableau-cadre" id="tableau-cadre">
        <table class="tableau" id="tableau">
          <thead id="tableau-tete"></thead>
          <tbody id="tableau-corps"></tbody>
        </table>
      </div>

      <div class="message" id="message" hidden>
        <p class="message-texte" id="message-texte"></p>
        <button class="bouton" id="message-bouton" hidden></button>
      </div>
    </main>
  </div>

  <footer class="pied">
    <button class="bouton bouton--fantome" id="btn-rapport" data-i18n="btnReport"></button>
    <button class="bouton bouton--fantome" id="btn-rescan" data-i18n="btnRescan"></button>
    <button class="bouton bouton--danger" id="btn-reset" data-i18n="btnReset"></button>
  </footer>

  <!-- LE RAPPORT, EN PLEIN PANNEAU. Une vue qui recouvre tout plutôt qu'un
       fichier téléchargé : ce qu'on fait d'un rapport, c'est le coller dans une
       conversation, pas l'attacher. Et une zone de texte qu'on peut lire avant
       de copier est la seule façon de VÉRIFIER ce qu'on envoie — le fichier ne
       faisait que le promettre. -->
  <section class="rapport" id="rapport" hidden role="dialog" aria-modal="true"
           aria-labelledby="rapport-titre">
    <header class="rapport-tete">
      <div class="rapport-texte-tete">
        <h2 class="rapport-titre" id="rapport-titre" data-i18n="reportTitle"></h2>
        <p class="rapport-desc" data-i18n="reportDesc"></p>
      </div>
      <button class="bouton bouton--fantome" id="rapport-fermer" data-i18n="btnClose"></button>
    </header>
    <!-- readonly, pas disabled : un champ désactivé n'est ni sélectionnable ni
         copiable, et c'est tout ce qu'on lui demande. -->
    <textarea class="rapport-zone" id="rapport-zone" readonly spellcheck="false"
              aria-describedby="rapport-titre"></textarea>
    <footer class="rapport-pied">
      <button class="bouton" id="rapport-copier" data-i18n="btnCopy"></button>
      <button class="bouton bouton--fantome" id="rapport-actualiser" data-i18n="btnRefresh"></button>
      <span class="pied-note" id="rapport-note" hidden></span>
    </footer>
  </section>

  <!-- Confirmation des actions irréversibles. Une boîte dans le panneau et non
       un confirm() natif : confirm() est bloquant, non traduisible, et son
       apparence n'appartient à personne. -->
  <div class="voile" id="voile" hidden>
    <div class="boite" role="alertdialog" aria-modal="true" aria-labelledby="boite-titre">
      <h3 id="boite-titre" class="boite-titre"></h3>
      <p class="boite-texte" id="boite-texte"></p>
      <div class="boite-pied">
        <button class="bouton" id="boite-annuler" data-i18n="btnCancel"></button>
        <button class="bouton bouton--danger" id="boite-ok" data-i18n="btnConfirm"></button>
      </div>
    </div>
  </div>

  <script src="panneau.js"></script>
</body>
</html>
