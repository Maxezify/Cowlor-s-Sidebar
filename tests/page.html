<!doctype html>
<html lang="fr" data-a-theme="dark"><head><meta charset="utf-8"><title>Faux Twitch</title>
<!-- Twitch pose une racine à 62,5 %, soit 10 px : c'est l'échelle contre
     laquelle TOUT le CSS de l'extension est écrit (1,15rem pour un bouton de
     filtre, 1,4rem pour un titre d'aperçu, 1,1rem pour un badge). Sans cette
     règle, le harnais rendait ces tailles sur une base de 16 px — 18,4 px au
     lieu de 11,5 — et toute mesure de largeur ou de hauteur y était fausse. -->
<style>
html { font-size: 62.5%; }
/* ── LES DEUX THÈMES DE TWITCH, MODÉLISÉS PAR SES VARIABLES ──────────────
   Twitch expose sa palette en variables CSS et bascule « data-a-theme » sur
   <html> ; toute sa feuille en découle, et depuis la 4.8 la nôtre aussi. Un
   harnais qui ne les pose pas mesure des contrastes contre un fond qui
   n'existe nulle part — c'est ce qui est arrivé à la première rédaction de
   la sonde de thème, laquelle relevait du texte clair « sur du gris 153 ».
   Les valeurs sont celles de Twitch, relevées sur ses deux thèmes. */
html, html[data-a-theme="dark"] {
  --color-background-base:  #0e0e10;
  --color-background-alt:   #18181b;
  --color-background-alt-2: #1f1f23;
  --color-text-base:        #efeff1;
  --color-text-alt:         #adadb8;
  --color-text-alt-2:       #6e6e7a;
}
html[data-a-theme="light"] {
  --color-background-base:  #ffffff;
  --color-background-alt:   #f7f7f8;
  --color-background-alt-2: #efeff1;
  --color-text-base:        #0e0e10;
  --color-text-alt:         #53535f;
  --color-text-alt-2:       #6e6e7a;
}
body { background: var(--color-background-base); color: var(--color-text-base); }
/* La carte de Twitch se pose sur le fond de la page, sans fond à elle. */
.side-nav-card { background: transparent; }
/* Twitch colore le texte de ses cartes par le lien qui les enveloppe ; sans
   cette règle, notre compteur de spectateurs — qui hérite sa couleur — se
   mesurait en BLEU DE LIEN, et aucun contraste relevé sur lui n'avait de sens. */
.side-nav-card a { color: var(--color-text-base); text-decoration: none; }
/* ── LA RANGÉE D'UNE CARTE, MODÉLISÉE ────────────────────────────────────
   Ce harnais n'a pas la feuille de style de Twitch. Sans mise en page, une
   question de CENTRAGE VERTICAL n'a pas de sens : tout mesure zéro.
   On reproduit donc ce que la capture d'écran montre, et rien de plus — deux
   colonnes côte à côte, chacune de deux lignes : à gauche le pseudo puis la
   catégorie, à droite les spectateurs puis la durée. C'est une MODÉLISATION,
   pas un relevé du CSS de Twitch, et l'assertion qu'elle sert ne prouve donc
   que ceci : notre règle centre bien ce qu'elle vise dans une rangée ainsi
   faite. Le marqueur, lui, est éprouvé sans elle. */
.metacell { display: flex; align-items: flex-start; }
.metacell > [data-a-target="side-nav-card-metadata"] { flex: 1; }
.metacell p, .metacell span { display: block; line-height: 16px; margin: 0; }
.side-nav-card__live-status { min-height: 32px; }
/* __rangeeFigee : Twitch ÉPINGLE la colonne des métadonnées en haut de sa
   rangée, avec une règle qui gagne. C'est l'hypothèse que deux versions ont
   manquée : une correction qui se contente de demander l'étirement perd contre
   elle, et le pseudo reste en haut — vert au banc, sans effet sur la vraie
   page. Le harnais la pose donc pour de bon, et la règle de l'extension doit
   passer devant. Elle est écrite AVANT la feuille de l'extension, exactement
   comme celle de Twitch : à spécificité égale, c'est l'ordre qui tranche. */
.side-nav-card[data-figee] [data-a-target="side-nav-card-metadata"] {
  align-self: flex-start !important;
}
/* ── LA CARTE SPONSORISÉE, MODÉLISÉE D'APRÈS LE TERRAIN (4.21.2) ─────────
   Le balisage de __addPromotedCard est celui d'une vraie carte relevée sur
   Twitch, classes hachées comprises. Ces règles-ci en modélisent la mise en
   page native, telle que la capture sans extension la montre : avatar ×
   logo sur une rangée avec le compteur à droite, puis le pseudo, la
   catégorie et le bandeau « Sponsorisé ».

   LE « !important » EST LE CŒUR DU MODÈLE. Les règles de l'extension
   correspondaient à ce DOM niveau pour niveau, et perdaient quand même :
   seule une déclaration « !important » côté Twitch explique qu'un
   « display: contents » plus spécifique n'ait pas pris sur le bloc
   avatar + compteur. Sans lui, ce harnais rend la carte juste avec les
   règles d'avant — ce qu'il a fait à la première écriture — et ne voit
   rien. Le conteneur de la grille, lui, n'en porte pas : la capture montre
   que la grille d'avant s'appliquait bien. Sélecteurs à une classe, comme
   ceux de Twitch. */
.side-nav-card__link--promoted-followed { display: flex; padding: 5px 10px; }
.jmIB { position: relative; width: 100%; }
.nFCLd { position: absolute; inset: 0; background: linear-gradient(90deg, #a970ff55, transparent); }
.hpEmRF { display: flex; flex-direction: column; position: relative; }
.ljZXzA { display: flex !important; justify-content: space-between; align-items: center; }
.geLFjm { display: flex !important; align-items: center; gap: 4px; }
.jHuNIx, .jHuNIx img { width: 30px; height: 30px; border-radius: 50%; }
.kCPnxe { width: 30px; height: 30px; border-radius: 50%; }
.bPLZqY { display: flex; align-items: center; }
.hyrBH { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.cbeJYP, .cWEeTu { margin: 0; line-height: 18px; overflow: hidden; white-space: nowrap;
                   text-overflow: ellipsis; }
.kHgzIE { display: flex; gap: 4px; }
.side-nav-card__link__tooltip-arrow { display: none; }
</style>
</head>
<body>
<div id="root">
  <!-- Rangée des stories, copiée du DOM réel (21/08/2026) : elle vit À CÔTÉ
       de #side-nav, pas dedans, et sa classe est `storiesLeftNavSection--…`.
       Une page de test qui la place dans la barre laisse passer le bug. -->
  <div class="Layout-sc-1xcs6mc-0 dQMmwU storiesLeftNavSection--csO9S" style="margin-top: 0.7rem;">
    <button><div aria-label="4 chaînes avec des stories non lues">
      <div><div class="tw-avatar"><img class="tw-image-avatar" alt="36318615" src="https://cdn/a.png"></div></div>
      <div><div class="tw-avatar"><img class="tw-image-avatar" alt="41812776" src="https://cdn/b.png"></div></div>
    </div><div aria-label="Ouvrir les stories"><p title="Ouvrir les stories">Ouvrir les stories</p></div></button>
  </div>
  <nav id="side-nav">
    <!-- LE TITRE RACINE PORTE DEUX CHOSES, PAS UNE, et ce décor-ci n'en avait
         qu'une. Le bouton de repli de Twitch vit dans le même bloc que le
         <h3>, à sa droite — c'est exactement ce que le décor taisait, et un
         retour de terrain l'a payé : la roue, ajoutée en fin de bloc, se
         posait APRÈS ce bouton, à l'extrême droite de la barre, au lieu d'être
         collée au titre. Le banc ne pouvait pas le voir : `appendChild` et
         « juste après le <h3> » donnent le même résultat quand le <h3> est
         seul. Un décor trop simple est un décor qui ment. -->
    <div class="side-nav__title">
      <h3>Chaînes suivies</h3>
      <button id="native-collapse" aria-label="Réduire la barre latérale">&#8592;|</button>
    </div>

    <div class="side-nav-section" aria-label="Chaînes suivies">
      <!-- Copie FIDÈLE du DOM réel de Twitch (relevé le 20/08/2026).
           Le point qui compte : le titre de section vit À L'INTÉRIEUR du
           bouton de tri, pas à côté. Une page de test qui les sépare laisse
           passer un bug de renommage — c'est exactement ce qui est arrivé. -->
      <div class="followed-side-nav-header followed-side-nav-header--expanded">
        <button id="native-sort" aria-expanded="false" aria-label="Trier par">
          <div class="followed-side-nav-header__dropdown-trigger">
            <div data-a-target="side-nav-header-expanded">
              <h3>Chaînes suivies</h3>
              <p>  </p>
            </div>
            <div><svg width="24" height="24" viewBox="0 0 24 24" role="img">
              <title>Options de tri</title>
              <path d="M13 7 8 2 3 7l1.414 1.621L7 6v9h2V6l2.5 2.5L13 7Z"></path>
            </svg></div>
          </div>
        </button>
      </div>
      <div id="cards"></div>
      <button data-a-target="side-nav-show-more-button">Afficher plus</button>
    </div>
    <!-- Section de recommandation de Twitch. Elle parle de ce que
         l'utilisateur suit, donc elle n'a plus de sens en Top Chaînes. -->
    <div class="side-nav-section" aria-label="Chaînes live">
      <div class="side-nav-header"><h4>Chaînes live</h4></div>
      <div id="reco"></div>
    </div>
  </nav>
</div>
<script>
// ── Fixtures pilotées depuis le test ────────────────────────────────
window.__fx = {};          // login -> {id, createdAt, viewers, game, tags} | null (hors ligne)
window.__gs = {};           // channelId -> session Guest Star simulée
window.__gsMode = 'ok';     // 'ok' | 'down' (l'API refuse)
window.__calls = [];       // journal : une entrée par POST { n: nb d'opérations, ops:[logins] }
window.__vod = {};         // chapitres de VOD par login (cf. TseVodChapters)
window.__vodRecent = {};   // archive récente par login (cf. TseVodRecent, le repli)
window.__clips = {};       // clips par login (cf. TseClips, la troisième porte)
window.__tagTop = {};      // classement par tag de langue (cf. TseTagTop)
window.__declarees = {};   // login -> code ISO de la langue déclarée (cf. TseLangCheck)
window.__failNext = 0;     // nb de POST à faire échouer
window.__httpStatus = 0;   // statut HTTP à rendre une fois (429, 503, …)
window.__abort = false;    // abandon au délai (AbortError), une fois
window.__badJson = false;  // corps illisible, une fois
window.__gqlErrors = false;// 200 porteur d'erreurs GraphQL, une fois
// login -> login de l'hôte : la carte est rendue comme celle d'un CO-STREAMER
// participant (cf. __addCard). Twitch y ajoute deux marques, et les DEUX
// comptent : la pastille iconContainer--primary sur l'avatar, que l'extension
// masque, et un mini-avatar DANS le bloc metadata, qui, lui, occupe une ligne.
window.__costreamHost = {};
// Logins dont la rangée ÉPINGLE la colonne des métadonnées en haut (cf. la
// feuille ci-dessus). Modélise une règle de Twitch qui gagne contre une simple
// demande d'étirement.
window.__rangeeFigee = [];

// ── Traduction des catégories ───────────────────────────────────────
// Twitch sert DEUX noms par catégorie : `name`, canonique et anglais, celui
// des URL et le seul que `game(name:)` accepte ; et `displayName`, traduit
// d'après l'en-tête Accept-Language de la requête. Le stub reproduit ce
// couple, sans quoi rien ne distinguerait une extension qui affiche la
// traduction d'une qui affiche l'anglais — les deux chaînes seraient égales.
// Table : nom canonique -> { <langue> : traduction }. Posée seulement si
// personne ne l'a fixée avant : les captures de présentation la vident, faute
// de traductions VÉRIFIÉES pour les douze langues de fiche — une image publiée
// ne doit pas porter une traduction inventée.
window.__i18nCats = window.__i18nCats || {
  'Just Chatting': { fr: 'Discussions', de: 'Nur Chatten', es: 'Solo charlando' },
};
// En-tête Accept-Language du DERNIER POST reçu. C'est ce que le test lit pour
// vérifier que l'extension demande bien la langue de l'interface.
window.__lastAcceptLanguage = null;
const traduire = (nom) => {
  const t = window.__i18nCats[nom];
  if (!t) return nom;                       // pas de traduction connue : Twitch
  const l = (window.__lastAcceptLanguage || 'en').slice(0, 2).toLowerCase();
  return t[l] || nom;                       // rend alors le nom canonique
};

// ── Chaînes globales ────────────────────────────────────────────────
// __cats : [{ name, viewers, streams:[{login, viewers, tags?}] }]
//   `viewers` de la catégorie est LIBRE : les tests s'en servent pour
//   fabriquer des cas où la somme des streams connus est très inférieure au
//   total annoncé — exactement la situation réelle (une catégorie a des
//   milliers de streams, on n'en voit que le sommet).
window.__cats = [];
// L'API rend `games` classé. Mis à true, le stub le rend À L'ENVERS : c'est
// ainsi qu'on vérifie que le module NE FAIT PAS confiance à cet ordre.
window.__catsUnsorted = false;
// L'API rend `streams` en DÉSORDRE (mesuré). Le stub reproduit ce défaut
// TOUJOURS, et c'est ce qui donne leur valeur aux assertions de classement :
// une réponse déjà triée les laisserait passer quoi que fasse le module.
//
// Un interrupteur permettait de rendre l'ordre décroissant. Aucun scénario ne
// l'a jamais mis à true depuis l'entrée du harnais dans le dépôt : il ne
// décrivait donc pas un cas éprouvé, seulement une intention. Le décor n'a
// qu'un seul comportement, et il est ici.
// Fait échouer les SEULES opérations du mode global. Sert à vérifier que la
// panne reste confinée : la sidebar « Chaînes suivies » doit continuer.
window.__globalFail = false;
// Latence (ms) appliquée aux opérations du mode global. Sans elle, la marche
// structurelle est instantanée dans le harnais et la transition — donc le
// voile qui la couvre — n'a aucune durée observable.
window.__catDelay = 0;
/* Retard par NOM D'OPÉRATION, en millisecondes. L'ordre dans lequel deux
   requêtes lancées ensemble reviennent n'est pas garanti sur un vrai réseau, et
   du code qui n'est juste que dans un seul des deux ordres est du code faux la
   moitié du temps. Sans ce réglage, le harnais rend toujours le même ordre — et
   le mutant qui casse l'autre survit sans qu'on sache pourquoi. */
window.__retardOp = {};
// Logins que les réponses `TseCategoryTop` doivent OMETTRE, pour reproduire
// l'échantillonnage mesuré de l'API (une chaîne présente 4 appels sur 6).
window.__hidden = [];
// Compte les fois où le gestionnaire natif du bouton de tri a été atteint.
// Doit rester à 0 : l'extension intercepte en phase de capture.
window.__nativeSortOpened = 0;
// Nombre de requêtes PORTANT UN FILTRE DE LANGUE à faire échouer au niveau
// TRANSPORT (comme une coupure réseau), et non à faire rejeter par le
// serveur. Les deux ne doivent pas avoir les mêmes conséquences.
window.__failLang = 0;

// Construit une carte fidèle au markup de la sidebar Twitch.
// Carte d'une section de recommandation (hors « Chaînes suivies »).
// Le marqueur data-test-selector="followed-channel" est RETIRÉ : sur le vrai
// Twitch, seules les chaînes SUIVIES le portent, et l'extension s'en sert à
// trois endroits (exemption des filtres, relevé du roster, déclenchement du
// relevé d'abonnements). Un harnais qui le laissait sur les recommandées
// faisait passer ces trois comportements pour de bonnes raisons qu'ils
// n'avaient pas. La valeur de remplacement importe peu — seule compte
// l'absence du marqueur « suivi ».
window.__addReco = (login, cat, viewersText) => {
  const d = window.__addCard(login, cat, viewersText);
  d.querySelector('a[data-test-selector="followed-channel"]')
   ?.setAttribute('data-test-selector', 'recommended-channel');
  document.getElementById('reco').appendChild(d);
  return d;
};

window.__addCard = (login, cat, viewersText, live = true) => {
  const d = document.createElement('div');
  d.className = 'side-nav-card';
  if ((window.__rangeeFigee || []).includes(login)) d.setAttribute('data-figee', '');
  d.innerHTML =
    '<a class="side-nav-card__link" data-a-target="side-nav-card" ' +
        'id="nav-' + login + '" aria-label="' + login + ', ' + cat + '" ' +
        'data-test-selector="followed-channel" href="/' + login + '">' +
      // __avatarNu : cartes dont l'avatar N'EST PAS enveloppé d'un <figure>.
      // Twitch ne rend pas toujours la même chose — une chaîne avec des
      // stories, par exemple, porte un décor supplémentaire autour de son
      // avatar. avatarOf() couvre cinq formes ; un harnais qui n'en sert
      // qu'une ne peut pas dire si le reste du code les couvre aussi.
      // __avatarStories : l'avatar n'est PAS dans .side-nav-card__avatar mais
      // dans un décor de stories, comme Twitch le rend pour une chaîne qui en
      // publie. C'est la quatrième forme que couvre avatarOf(), et celle que
      // le CSS ne couvrait pas — d'où un anneau présent sur une carte et
      // absent sur sa voisine, sans raison visible.
      ((window.__avatarStories || []).includes(login)
        ? '<div class="stories-ring' + (live ? '' : ' side-nav-card__avatar--offline') + '">' +
            ((window.__avatarNu || []).includes(login)
              ? '<div class="tw-avatar"><img class="tw-image-avatar" alt="" src="https://cdn/' + login + '.png"></div>'
              : '<figure class="tw-avatar"><img class="tw-image-avatar" alt="" src="https://cdn/' + login + '.png"></figure>') +
          '</div>'
        : '<div class="side-nav-card__avatar' + (live ? '' : ' side-nav-card__avatar--offline') + '">' +
            ((window.__avatarNu || []).includes(login)
              ? '<div class="tw-avatar"><img class="tw-image-avatar" alt="" src="https://cdn/' + login + '.png"></div>'
              : '<figure class="tw-avatar"><img class="tw-image-avatar" alt="" src="https://cdn/' + login + '.png"></figure>') +
            ((window.__costreamHost || {})[login]
              ? '<div class="iconContainer--primary"></div>' : '') +
          '</div>') +
      '<div class="mainblock"><div class="metacell">' +
        // DEUX NIVEAUX, ET ILS NE SONT PAS INTERCHANGEABLES. Le bloc marqué
        // data-a-target est le conteneur ; .side-nav-card__metadata est le
        // groupe qu'il enveloppe, et c'est LUI qui porte le pseudo et la
        // catégorie. Le CSS de l'extension s'appuie sur les deux (une règle
        // masque « tout frère de .side-nav-card__metadata », la 3e ligne de
        // titre de Twitch) : un harnais qui aplatit les deux en un ne peut
        // pas départager une règle qui épargne le groupe d'une règle qui
        // l'efface — et celle qui l'efface viderait la carte en production.
        '<div data-a-target="side-nav-card-metadata">' +
          '<div class="side-nav-card__metadata">' +
            '<p data-a-target="side-nav-title">' + login + '</p>' +
            // UNE CATÉGORIE ABSENTE EST UN <p> ABSENT, pas un <p> vide : c'est
            // ce que Twitch rend pour une chaîne qui n'en déclare pas, et c'est
            // ce qui laisse le pseudo seul sur une rangée haute de deux lignes.
            (cat ? '<p title="' + cat + '">' + cat + '</p>' : '') +
            // __costreamHost : la carte est celle d'un CO-STREAMER participant.
            // Twitch pose alors un mini-avatar DANS le bloc metadata, dont l'alt
            // nomme l'hôte — c'est de lui que getCostreamInfo tire le login de
            // l'hôte. Il occupe une ligne, et c'est ce qui distingue une carte
            // de co-stream d'une carte ordinaire pour toute question de hauteur.
            ((window.__costreamHost || {})[login]
              ? '<span class="tse-mini"><img alt="Co-stream d\'un stream de '
                  + window.__costreamHost[login] + '" src="https://cdn/'
                  + window.__costreamHost[login] + '.png"></span>'
              : '') +
          '</div>' +
        '</div>' +
        '<div class="side-nav-card__live-status"><div><div>' +
          (live ? '<span class="tw-channel-status-indicator"></span>' : '') +
          '<span aria-hidden="true">' + viewersText + '</span>' +
          '<p class="sr-only">' + viewersText + ' spectateurs</p>' +
        '</div></div></div>' +
      '</div></div>' +
    '</a>';
  document.getElementById('cards').appendChild(d);
  return d;
};

// Une carte SPONSORISÉE, au balisage relevé sur Twitch (classes hachées
// comprises) : avatar, croix « en collaboration avec » et logo de la marque
// sur une rangée avec le compteur, puis le pseudo, la catégorie et le bandeau.
// `cat` absent : pas de bloc de catégorie. Cf. scénario 166.
window.__addPromotedCard = (login, cat, viewersText, marque) => {
  const d = document.createElement('div');
  d.className = 'Layout-sc-1xcs6mc-0 glFavL side-nav-card';
  d.innerHTML =
    '<a aria-haspopup="dialog" class="ScCoreLink-sc-16kq0mq-0 dUHnPJ InjectLayout-sc-1i43xsx-0 hbFSpS ' +
        'side-nav-card__link side-nav-card__link--promoted-followed tw-link" href="/' + login + '">' +
      '<div class="Layout-sc-1xcs6mc-0 jmIB">' +
        '<div class="Layout-sc-1xcs6mc-0 nFCLd side-nav-promoted-followed-card__gradient"></div>' +
        '<div class="Layout-sc-1xcs6mc-0 hpEmRF">' +
          '<div class="Layout-sc-1xcs6mc-0 ljZXzA">' +
            '<div class="Layout-sc-1xcs6mc-0 geLFjm">' +
              '<div class="ScAvatar-sc-144b42z-0 jHuNIx tw-avatar">' +
                '<img class="InjectLayout-sc-1i43xsx-0 ceDQrC tw-image-avatar" src="https://cdn/' + login +
                  '.png" alt="' + login + '"></div>' +
              '<img alt="en collaboration avec" width="8" height="8" class="tw-image" src="https://cdn/x.svg">' +
              '<div class="Layout-sc-1xcs6mc-0 kCPnxe" style="background-color: rgb(7, 21, 58);">' +
                '<img alt="Logo de ' + marque + '" class="tw-image" src="https://cdn/logo.png"></div>' +
            '</div>' +
            '<div class="Layout-sc-1xcs6mc-0 NaOSo side-nav-card__live-status">' +
              '<div class="Layout-sc-1xcs6mc-0 bPLZqY">' +
                '<div class="ScChannelStatusIndicator-sc-bjn067-0 fWOmHx tw-channel-status-indicator"></div>' +
                '<p class="CoreText-sc-1txzju1-0 fJYwSz InjectLayout-sc-1i43xsx-0 hyrBH">Live</p>' +
                '<div class="Layout-sc-1xcs6mc-0 gdJMkN">' +
                  '<span aria-hidden="true" class="CoreText-sc-1txzju1-0 fUSHSk">' + viewersText + '</span>' +
                  '<p class="CoreText-sc-1txzju1-0 fJYwSz InjectLayout-sc-1i43xsx-0 hyrBH">' + viewersText +
                    ' spectateurs</p>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="Layout-sc-1xcs6mc-0 scSXY side-nav-promoted-followed-card__title">' +
            '<p title="' + login + '" class="CoreText-sc-1txzju1-0 cbeJYP">' + login + '</p></div>' +
          (cat ? '<div class="Layout-sc-1xcs6mc-0 bCMrks side-nav-promoted-followed-card__content">' +
                   '<p title="' + cat + '" class="CoreText-sc-1txzju1-0 cWEeTu">' + cat + '</p></div>' : '') +
          '<div class="Layout-sc-1xcs6mc-0 gIWswv side-nav-promoted-followed-card__sponsorship">' +
            '<div class="Layout-sc-1xcs6mc-0 kHgzIE side-nav-card-promoted-bottom">' +
              '<p class="CoreText-sc-1txzju1-0 loWPjP">Sponsorisé</p>' +
              '<p title="•" class="CoreText-sc-1txzju1-0 cWEeTu">•</p>' +

  // lit pas dans une liste : sans horodatage, un banc ne peut pas dire si
  // six requêtes sont parties en six secondes ou toutes ensemble.

  // règle sous le voile qu'en croisière — bourse à part d'un côté, fenêtre

                                  && document.body.classList.contains('tse-loading')),
                        // Noms de TOUTES les opérations du lot : c'est ce qui

         faire le jour où l'un d'eux en demande un sixième. */

      // broadcasterLanguages: [FR] ne porte pas forcément le tag « Français ».
      // Le stub les distingue donc — `lang` pour le réglage, `tags` pour ce
      // qui est affiché — et retombe sur le tag quand `lang` n'est pas
      // précisé, pour ne rien changer aux décors existants.
      const parle = (s) => s.lang ? s.lang === mLang[1] : (s.tags || []).includes(wantTag);
      const visibles = c.streams
        .filter(s => !(window.__hidden || []).includes(s.login))
        .filter(s => !mLang || parle(s));

      const out = top.slice().reverse();       // cf. l'en-tête : jamais trié
      return { data: { game: {
        id: 'gid-' + c.name, name: c.name, viewersCount: c.viewers,
        streams: { edges: out.map(s => ({ node: {
          id: 's-' + s.login,
          createdAt: s.createdAt || '2026-01-01T00:00:00.000Z',
          viewersCount: s.viewers,
          // MÊME identifiant que celui servi par TseChannels quand la chaîne
          // est aussi une fixture : sur le vrai Twitch, `broadcaster.id` et
          // `user.id` désignent la même chaîne. Les faire diverger cachait un
          // défaut — la résolution Guest Star d'une carte du classement ne
          // trouvait alors jamais sa session.
          // __avatarRepertoire : le répertoire sert une AUTRE adresse d'avatar
          // que TseChannels pour la même chaîne. Rien ne garantit qu'elles
          // coïncident ; c'est ce qui permet de voir une carte hésiter entre
          // les deux. Cf. scénario 165.
          broadcaster: { id: (window.__fx[s.login] || {}).id || 'id-' + s.login,
                         login: s.login, displayName: s.login,
                         profileImageURL: 'https://cdn/' + (window.__avatarRepertoire || 'api-')
                           + s.login + '.png' },
          game: { id: 'gid-' + c.name, name: c.name, displayName: traduire(c.name) },
          freeformTags: (s.tags || []).map(t => ({ name: t }))
        } })) }
      } } };
    }
    if (o.operationName !== 'TseChannels') return { data: {} };
    let users = (o.variables.logins || []).map(mk).filter(Boolean);
    // Twitch ne garantit pas l'ordre : on le mélange pour que le code soit
    // obligé de s'indexer sur le login et non sur la position.
    if (window.__shuffle) users = users.slice().reverse();
    return { data: { users } };
  });
  return { ok: true, json: async () => data };
};
window.__mockFetch = window.fetch;

// Gestionnaires « de Twitch » sur le bouton de tri, posés en phase de
// BOUILLONNEMENT comme le ferait React.
for (const type of ['pointerdown', 'click']) {
  document.getElementById('native-sort').addEventListener(type, () => {
    window.__nativeSortOpened++;
  });
}

// ── Page /subscriptions ─────────────────────────────────────────────
// Reproduite d'après les relevés du 21/08 et du 31/08/2026, et la console du
// 24/09/2026 : un titre, SIX onglets (« Vos abonnements », « offerts »,
// « mobiles », « Turbo », « autres », « expirés »), et SOUS eux le panneau de
// l'onglet choisi. Les onglets sont des <button role="tab"
// data-a-target="tw-tab-link"> SANS adresse — la 4.19.2 les avait modélisés en
// liens d'après une capture, et le vrai Twitch lui a donné tort. Chaque abonnement y est un [data-a-target="subscription-card"]
// contenant le lien de la chaîne. Rendue APRÈS un délai, comme la vraie : c'est
// une SPA, et le `load` de l'iframe précède l'apparition des cartes.
//
// CHANGER D'ONGLET NE RECHARGE PAS LA PAGE. La vraie rapatrie les cinq listes
// d'un coup en se chargeant (vu dans la console : un lot, cinq opérations) ;
// un clic sur un onglet change l'adresse et redessine le panneau. Le décor
// fait pareil, et compte ses chargements dans `window.top.__subsChargements`.
//
// __noSubsPage coupe cette page : certains scénarios éprouvent la lecture
// PAR VISITE seule, et le relevé complet y ajouterait ses propres chaînes.
if (location.pathname === '/subscriptions' && !window.__noSubsPage) {
  try { window.top.__subsChargements = (window.top.__subsChargements || 0) + 1; }
  catch { /* sommet d'une autre origine : rien à compter */ }
  // « turbo » et « expired » sont ici EXPRÈS, avec des chaînes qui
  // n'apparaissent nulle part ailleurs : si le module venait à lire Turbo, ou à
  // verser des expirés parmi les abonnements en cours, le relevé le dirait.
  const ONGLETS = {
    paid:    ['omofficial', 'roicheese', 'etoiles'],
    gifts:   ['clem_mlrt'],
    mobile:  ['zerator'],
    turbo:   ['jamais_turbo'],
    expired: ['jenfirer', 'antoinedaniel', 'etoiles'],
    // L'onglet que Twitch AJOUTERAIT un jour (cf. __subsOngletEnPlus).
    extra:   ['jamais_extra'],
  };
  // Ancienneté par chaîne, en mois. Sur la vraie page elle est écrite dans
  // une paire <p> étiquette + <span> valeur, sans le moindre data-*.
  const MOIS = {
    omofficial: 1, roicheese: 4, etoiles: 12, clem_mlrt: 2, zerator: 7,
    jenfirer: 1, antoinedaniel: 29,
  };
  // Les abonnements RÉVOLUS : chaînes qui n'apparaissent dans aucun autre
  // onglet, plus une (etoiles) qui figure AUSSI dans « paid ». Ce doublon est
  // délibéré — il reproduit un réabonnement après interruption, et vérifie
  // que la lecture des expirés ne dégrade pas un abonnement en cours.
  const EXPIRES = ['jenfirer', 'antoinedaniel', 'etoiles'];
  // Jours jusqu'au prochain anniversaire, par chaîne (9 à défaut) : 0 et 1
  // pour « aujourd'hui » et le singulier.
  const ANNIV = { omofficial: 0, etoiles: 1, clem_mlrt: 23, zerator: 3 };
  // Une date à `j` jours d'aujourd'hui, écrite comme Twitch l'écrit en français.
  const DATE = (j) => {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + j);
    return new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })
      .format(d);
  };
  // Jours jusqu'au 12 du mois prochain (cf. carteDe).
  const EXPIRATION = () => {
    const a = new Date(); a.setHours(0, 0, 0, 0);
    const d = new Date(a.getFullYear(), a.getMonth() + 1, 12);
    return Math.round((d - a) / 86_400_000);
  };
  // La barre, dans l'ordre et avec les mots de la vraie page.
  const BARRE = [['paid', 'Vos abonnements'], ['gifts', 'Abonnements offerts'],
                 ['mobile', 'Abonnements mobiles'], ['turbo', 'Abonnement Turbo'],
                 ['other', 'Autres abonnements'], ['expired', 'Abonnements expirés']];
  // Twitch écrit TOUJOURS quelque chose à la place d'une liste vide.
  const VIDE = 'Aucun abonnement de ce type pour le moment.';
  const ongletCourant = () => new URLSearchParams(location.search).get('tab') || 'paid';

  const carteDe = (login, tab) => {
    const carte = document.createElement('div');
    carte.className = 'subscription-card';
    /* __subCardAttr : le jour où Twitch renomme cet attribut, la page rend
       EXACTEMENT les mêmes cartes sous un autre nom — et le relevé rend
       zéro sans rien dire. C'est le cas que le décor ne savait pas jouer, et
       qu'un rapport de terrain a exigé. */
    carte.setAttribute('data-a-target', window.__subCardAttr || 'subscription-card');
    const passe = EXPIRES.includes(login) && tab === 'expired';
    const m = MOIS[login] || 0;
    // Copie FIDÈLE des cartes relevées le 31/08 et le 24/09/2026. Ce qui compte :
    //  • l'ancienneté est une paire <p> étiquette + <span> valeur, SANS
    //    aucun data-* pour la désigner ;
    //  • une carte en cours en porte d'autres qui lui ressemblent — l'anniversaire
    //    (en JOURS, et placé AVANT), la série en cours, et une date : celle du
    //    renouvellement sur une carte payante, celle de l'expiration sur une
    //    offerte, qui nomme aussi son donateur. Un harnais qui n'en poserait
    //    qu'une laisserait passer un relevé qui prend le premier nombre venu ;
    //  • une carte EXPIRÉE n'en porte qu'une, et c'est ce qui permet
    //    d'apprendre l'étiquette sans lire le français.
    const etiquette = 'Nombre total de mois abonné :';
    const offert = tab === 'gifts';
    const j = ANNIV[login] ?? 9;
    /* __subsAvantAnniv : deux lignes chiffrées AVANT l'anniversaire — la série,
       en mois, et une date d'abonnement. Aucune des deux n'est l'anniversaire ;
       une refonte de Twitch pourrait les placer là. */
    const avantAnniv = window.__subsAvantAnniv
      ? '<p>Nombre de mois à la suite :</p><span>' + Math.max(1, m - 1) + ' mois</span>' +
        '<p>Abonné depuis le : <span>3 mars 2023</span></p>'
      : '';
    const bruit = passe
      ? '<p class="expired-sub-message">Réabonnez-vous pour débloquer ' +
        '<span class="expired-sub-message">instantanément</span></p>'
      : avantAnniv + '<p>Prochain anniversaire d\'abonnement dans : <span>' + j + ' jour' +
        (j > 1 ? 's' : '') + '</span></p>' +
        (offert ? '<p>Abonnement offert par : <span>donateur42</span></p>' : '');
    /* La date, puis le compte de jours de Twitch en texte nu À CÔTÉ du <span>,
       comme sur la capture : « 17 oct. 2026 (dans 22 jours) ». L'expiration
       d'un abonnement offert tombe LE 12 DU MOIS PROCHAIN, exprès : « 2 nov. »
       est alors une date candidate, plus proche, et elle se lit DANS
       « 12 nov. » à qui ne borne pas ses correspondances. */
    const fin = offert ? EXPIRATION() : j - 1;
    const date = offert
      ? '<p>Vos avantages arrivent à expiration le <span>' + DATE(fin) + '</span> (dans ' + fin + ' jours)</p>'
      : '<p>Date de renouvellement de l\'abonnement : <span>' + DATE(Math.max(0, fin)) +
        '</span> (dans ' + Math.max(0, fin) + ' jours)</p>';
    /* __subsDatesTardives : { login: ms } — la ligne de la date arrive APRÈS
       le reste de la carte, et pas au même instant pour toutes. Chaque écart
       tient sous la stabilité exigée d'une liste, leur somme la dépasse :
       c'est ce qu'une liste qui s'écrit carte par carte ferait. */
    const tardive = (window.__subsDatesTardives || {})[login] || 0;
    const suite = passe ? '' :
      '<p>Nombre de mois à la suite :</p><span>' + Math.max(1, m - 1) + ' mois</span>' +
      (tardive ? '' : date);
    // Le SQUELETTE : lien et nom, ce qui suffit à reconnaître la chaîne.
    carte.innerHTML = '<div class="subscription-card-banner">' +
      '<a class="tw-link" href="/' + login + '"></a></div>' +
      '<p data-a-target="subscription-card__channel-name">' + login + '</p>';
    // Le CORPS — dont l'ancienneté — arrive après, comme dans une liste
    // React qui s'écrit par morceaux. __subsProgressif règle ce décalage.
    const corps = bruit +
      (m ? '<p>' + etiquette + '</p><span>' + m + ' mois</span>' : '') +
      suite +
      '<div class="subscription-card__sub-progress"><div class="sub-badge-progress">' +
      '<p class="sub-badge-progress__current-badge--text">Badge de 3 mois</p>' +
      '<p class="sub-badge-progress__next-badge--text">Badge de 6 mois</p>' +
      '</div></div>';
    const retard = window.__subsProgressif || 0;
    if (retard) setTimeout(() => { carte.insertAdjacentHTML('beforeend', corps); }, retard);
    else carte.insertAdjacentHTML('beforeend', corps);
    if (tardive && !passe) {
      setTimeout(() => {
        carte.querySelector('.subscription-card__sub-progress')?.insertAdjacentHTML('beforebegin', date);
      }, retard + tardive);
    }
    return carte;
  };

  // Ce que la page met SOUS ses onglets, pour l'onglet `tab`. Le retard du
  // message ne vaut qu'au PREMIER affichage : les données arrivent une fois,
  // tard, et un changement d'onglet réutilise ce qui est déjà là.
  let premierAffichage = true;
  let messageEnAttente = null;
  const peindre = (panneau, tab) => {
    const retard = premierAffichage ? (window.__subsMessageRetard || 0) : 0;
    premierAffichage = false;
    // Un nouvel affichage remplace l'ancien, y compris ce qu'il allait écrire.
    if (messageEnAttente) { clearTimeout(messageEnAttente); messageEnAttente = null; }
    panneau.replaceChildren();
    /* __subsBlanc : la page se montre, barre et onglets compris, et ne rend
       JAMAIS rien dessous. C'est ce que le relevé a vu le 24/09/2026. */
    if (window.__subsBlanc) return;
    /* __subsMessage : ce que Twitch affiche quand SA PROPRE requête échoue
       (« Impossible d'afficher vos abonnements pour le moment » — « failed
       integrity check » en console). __subsMessageRetard le fait arriver
       TARD, panneau blanc jusque-là : la capture de l'utilisateur le montrait
       à l'écran, le relevé ne l'avait pas vu. */
    if (window.__subsMessage) {
      const ecrire = () => {
        const m = document.createElement('p');
        m.textContent = window.__subsMessage;
        panneau.appendChild(m);
      };
      if (retard) messageEnAttente = setTimeout(ecrire, retard);
      else ecrire();
      return;
    }
    // __subsVides : onglets qui ne rendront AUCUNE carte — mais leur message.
    let logins = (window.__subsVides || []).includes(tab) ? [] : (ONGLETS[tab] || []);
    /* __subsOffertEnPlus : un abonnement offert EN ATTENTE derrière un payé —
       la même chaîne dans deux onglets en cours, avec deux dates. */
    if (tab === 'gifts' && window.__subsOffertEnPlus) logins = [...logins, 'roicheese'];
    if (!logins.length) {
      /* __subsVideMuet : un onglet vide dessiné SANS UN MOT — une image seule.
         Rien ne dit que Twitch le fasse ; le relevé ne doit pas en dépendre. */
      if (window.__subsVideMuet) {
        const img = document.createElement('div');
        img.className = 'illustration-vide';
        panneau.appendChild(img);
        return;
      }
      const p = document.createElement('p');
      p.textContent = VIDE;
      panneau.appendChild(p);
      return;
    }
    const zone = document.createElement('div');
    zone.id = 'subs-content';
    for (const login of logins) zone.appendChild(carteDe(login, tab));
    panneau.appendChild(zone);
  };

  // __subsDelay règle la lenteur de cette page. Elle sert à éprouver la
  // RETENUE du voile : avec une page lente, le voile doit rester tant que le
  // relevé n'est pas rentré ; sans retenue, il se lèverait bien avant.
  setTimeout(() => {
    /* LE CORPS PRINCIPAL. La vraie page range tout dans un <main> ; le décor
       aussi, sans quoi le relevé ne pourrait pas distinguer la zone des
       abonnements de la barre latérale — ni, désormais, le panneau de sa
       barre d'onglets. */
    const principal = document.createElement('main');
    const titre = document.createElement('h1');
    titre.textContent = 'Abonnements';
    principal.appendChild(titre);
    const barre = document.createElement('div');
    /* __subsOrdre : les onglets dans un autre ordre. __subsOngletEnPlus : un
       septième, glissé en DEUXIÈME place — là où il décale tous les suivants.
       Deux refontes que le relevé doit reconnaître avant de cliquer. */
    const onglets = window.__subsOrdre
      ? window.__subsOrdre.map((k) => BARRE.find(([c]) => c === k))
      : BARRE.slice();
    if (window.__subsOngletEnPlus) onglets.splice(1, 0, ['extra', 'Abonnements groupés']);
    let courant = ongletCourant();
    const boutons = [];
    // aria-selected sur le choisi, comme tout role="tab" — sauf __subsSansSelection.
    const selectionner = () => {
      if (window.__subsSansSelection) return;
      for (const [cle, el] of boutons) el.setAttribute('aria-selected', String(cle === courant));
    };
    for (const [cle, libelle] of onglets) {
      /* __subsSansBascule : des onglets qui n'en sont pas — ni bouton, ni
         rôle. Le relevé ne peut plus changer d'onglet dans la page, et doit
         recharger. */
      const el = document.createElement(window.__subsSansBascule ? 'span' : 'button');
      if (!window.__subsSansBascule) {
        el.setAttribute('role', 'tab');
        el.setAttribute('data-a-target', 'tw-tab-link');
      }
      // Le libellé et son compte, collés, comme sur la vraie page.
      const n = (ONGLETS[cle] || []).length;
      el.textContent = libelle + (n ? '(' + n + ')' : '');
      barre.appendChild(el);
      boutons.push([cle, el]);
    }
    selectionner();
    principal.appendChild(barre);
    const panneau = document.createElement('div');
    principal.appendChild(panneau);
    barre.addEventListener('click', (e) => {
      const b = boutons.find(([, el]) => el === e.target.closest('button'));
      if (!b) return;
      /* __subsClicMuet : des boutons qui ne mènent nulle part — la page ne
         change pas d'onglet. Le relevé doit s'en apercevoir et recharger. */
      if (window.__subsClicMuet) return;
      courant = b[0];
      /* __subsAdresseFixe : l'onglet change, l'adresse NON. Rien ne dit
         encore lequel des deux fait le vrai Twitch ; le relevé doit tenir
         dans les deux cas. */
      if (!window.__subsAdresseFixe) history.pushState(null, '', '/subscriptions?tab=' + courant);
      selectionner();
      // React redessine le panneau un peu après.
      setTimeout(() => peindre(panneau, courant), window.__subsRedessin ?? 80);
    });
    document.getElementById('root').appendChild(principal);
    peindre(panneau, ongletCourant());
  }, window.__subsDelay || 600);
}

// Montage TARDIF de la sidebar, piloté par le test (page.addInitScript).
// Reproduit ce que fait Twitch : au moment où l'extension démarre, #side-nav
// n'existe pas encore ; il apparaît ensuite, éventuellement en mode réduit.
// C'est la seule façon d'éprouver la ligne de base « réduit/étendu », qu'une
// page où la sidebar est déjà là ne peut pas mettre en défaut.
if (window.__lateMount) {
  const nav = document.getElementById('side-nav');
  const parent = nav.parentElement;
  nav.remove();
  setTimeout(() => {
    if (window.__lateCollapsed) parent.classList.add('side-nav--collapsed');
    parent.appendChild(nav);
  }, 400);
}
</script>
